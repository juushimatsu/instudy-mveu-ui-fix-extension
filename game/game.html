<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кликер «Студент» — InStudy Mono UI</title>
    <style>
        :root {
            --bg-0: #0a0a0c;
            --bg-1: #0e0e11;
            --bg-2: #15151a;
            --bg-3: #1c1c22;
            --bg-4: #26262d;
            --bg-5: #2f2f37;
            --border: #26262d;
            --border-2: #34343c;
            --text: #e8e8ec;
            --text-dim: #b0b0ba;
            --text-muted: #767680;
            --text-faint: #4f4f58;
            --accent: #f4f4f7;
            --accent-soft: #c8c8d0;
            --accent-dim: #80808a;
            --radius: 12px;
            --radius-sm: 8px;
            --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            --font-display: 'Unbounded', 'PT Sans', system-ui, sans-serif;
        }
        :root[data-theme="light"] {
            --bg-0: #f5f5f7;
            --bg-1: #ededf0;
            --bg-2: #e4e4e8;
            --bg-3: #dcdce2;
            --bg-4: #d4d4db;
            --bg-5: #d0d0d8;
            --border: #c8c8d0;
            --border-2: #c0c0ca;
            --text: #0a0a0c;
            --text-dim: #2a2a32;
            --text-muted: #5a5a65;
            --text-faint: #a0a0aa;
            --accent: #0a0a0c;
            --accent-soft: #2a2a32;
            --accent-dim: #8a8a94;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg-0);
            color: var(--text);
            font-family: var(--font-display);
            font-size: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-wrapper {
            width: 100%;
            max-width: 520px;
            height: 100%;
            max-height: 700px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0,0,0,.7);
        }

        /* Шапка */
        .game-header {
            background: var(--bg-2);
            border-bottom: 1px solid var(--border);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-shrink: 0;
        }
        .game-title {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: .04em;
            text-transform: uppercase;
            color: var(--accent);
        }
        .game-subtitle {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .header-stats {
            text-align: right;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
        }
        .header-stats span {
            color: var(--accent-soft);
            font-weight: 600;
        }

        /* Основная зона */
        .game-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 14px;
            position: relative;
            overflow: hidden;
        }

        /* Большая кнопка */
        .clicker-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: var(--bg-3);
            border: 2px solid var(--border-2);
            color: var(--accent);
            font-size: 72px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: transform .08s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
            position: relative;
            overflow: visible;
            flex-shrink: 0;
        }
        .clicker-btn:hover {
            background: var(--bg-4);
            border-color: var(--accent-dim);
            box-shadow: 0 0 30px rgba(244,244,247,.10);
        }
        .clicker-btn:active {
            transform: scale(0.92);
        }

        /* Статистика */
        .stats-block {
            text-align: center;
        }
        .knowledge-value {
            font-family: var(--font-mono);
            font-size: 32px;
            font-weight: 600;
            color: var(--accent);
            line-height: 1.1;
            letter-spacing: -.02em;
        }
        .knowledge-label {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .08em;
            margin-top: 2px;
        }
        .kps-line {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 6px;
        }
        .kps-line span {
            color: var(--accent-soft);
        }

        /* Прогресс-бар уровня */
        .level-bar-wrap {
            width: 100%;
            max-width: 280px;
        }
        .level-info {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: .06em;
        }
        .level-bar {
            width: 100%;
            height: 6px;
            background: var(--bg-3);
            border-radius: 3px;
            overflow: hidden;
        }
        .level-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width .3s ease;
        }

        /* Апгрейды */
        .upgrades-panel {
            flex-shrink: 0;
            max-height: 260px;
            overflow-y: auto;
            border-top: 1px solid var(--border);
            padding: 10px 14px;
            background: var(--bg-2);
        }
        .upgrades-panel::-webkit-scrollbar { width: 5px; }
        .upgrades-panel::-webkit-scrollbar-track { background: transparent; }
        .upgrades-panel::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 4px; }
        .upgrades-title {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .08em;
            margin-bottom: 8px;
            padding-left: 2px;
        }
        .upgrade-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 8px;
            border-radius: var(--radius-sm);
            margin-bottom: 4px;
            transition: background .15s ease;
        }
        .upgrade-item:hover {
            background: var(--bg-3);
        }
        .upgrade-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--bg-3);
            border: 1px solid var(--border-2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .upgrade-info {
            flex: 1;
            min-width: 0;
        }
        .upgrade-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .upgrade-desc {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: .03em;
        }
        .upgrade-count {
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--accent-soft);
            min-width: 28px;
            text-align: right;
        }
        .upgrade-buy {
            background: var(--bg-4);
            border: 1px solid var(--border-2);
            border-radius: var(--radius-sm);
            padding: 5px 12px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-dim);
            cursor: pointer;
            transition: all .15s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .upgrade-buy:hover {
            background: var(--bg-5);
            border-color: var(--accent-dim);
            color: var(--text);
        }
        .upgrade-buy:disabled {
            opacity: .3;
            cursor: not-allowed;
        }
        .upgrade-buy.affordable {
            border-color: var(--accent-dim);
            color: var(--accent);
        }

        /* Плавающий текст */
        .float-text {
            position: fixed;
            font-family: var(--font-mono);
            font-size: 16px;
            font-weight: 600;
            color: var(--accent);
            pointer-events: none;
            animation: floatUp .9s ease-out forwards;
            z-index: 1000;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.3); }
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-3);
            border: 1px solid var(--border-2);
            border-radius: var(--radius-sm);
            padding: 8px 16px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--accent-soft);
            z-index: 1000;
            pointer-events: none;
            animation: toastIn .3s ease, toastOut .3s ease 2.7s forwards;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes toastOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* ── События ── */
        .event-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2000;
            background: rgba(10,10,12,.70);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 14px;
        }
        .event-panel {
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 32px;
            text-align: center;
            box-shadow: var(--d-shadow-lg);
            min-width: 260px;
        }
        .event-title {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: .04em;
        }
        .event-subtitle {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 18px;
        }
        .event-timer {
            font-family: var(--font-mono);
            font-size: 28px;
            font-weight: 600;
            color: var(--accent);
            margin: 10px 0;
        }
        .event-score {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 8px;
        }
        .event-btn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: var(--bg-4);
            border: 2px solid var(--border-2);
            color: var(--accent);
            font-size: 48px;
            line-height: 1;
            cursor: pointer;
            user-select: none;
            transition: transform .06s ease, background .15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .event-btn:hover { background: var(--bg-5); border-color: var(--accent-dim); }
        .event-btn:active { transform: scale(0.90); }
        .event-btn.shake { animation: shake .4s ease both; }

        .event-moving-btn {
            position: absolute;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--bg-4);
            border: 2px solid var(--accent-dim);
            color: var(--accent);
            font-size: 28px;
            cursor: pointer;
            user-select: none;
            transition: top .25s ease, left .25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            z-index: 2001;
        }
        .event-moving-btn:active { transform: scale(0.88); }
        .event-moving-btn.spin { animation: spin 1s linear infinite; }

        .virus-banner {
            position: absolute;
            background: var(--bg-2);
            border: 2px solid var(--d-bad, #b07474);
            border-radius: var(--radius);
            padding: 18px 28px;
            box-shadow: 0 4px 24px rgba(176,116,116,.35);
            text-align: center;
            min-width: 220px;
            z-index: 2001;
        }
        .virus-title {
            font-family: var(--font-display);
            font-size: 13px;
            font-weight: 600;
            color: var(--d-bad, #b07474);
            margin-bottom: 10px;
        }
        .virus-close {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--bg-4);
            border: 1px solid var(--border-2);
            color: var(--text-dim);
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .virus-close:hover { background: var(--d-bad, #b07474); color: var(--bg-0); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Адаптив */
        @media (max-width: 540px) {
            .game-wrapper { border-radius: 0; max-width: 100%; max-height: 100%; }
            .clicker-btn { width: 140px; height: 140px; font-size: 56px; }
            .knowledge-value { font-size: 26px; }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="game-header">
            <div>
                <div class="game-title">Кликер «Студент»</div>
                <div class="game-subtitle">InStudy Mono UI</div>
            </div>
            <div class="header-stats">
                <div>Кликов: <span id="stat-clicks">0</span></div>
                <div>Всего: <span id="stat-total">0</span></div>
            </div>
        </div>

        <div class="game-main">
            <div class="stats-block">
                <div class="knowledge-value" id="knowledge">0</div>
                <div class="knowledge-label">Знаний</div>
                <div class="kps-line">
                    <span id="kps">+0</span>/сек &nbsp;|&nbsp; <span id="click-val">+1</span>/клик
                </div>
            </div>

            <div class="level-bar-wrap">
                <div class="level-info">
                    <span id="level-name">Первокурсник</span>
                    <span id="level-progress">0%</span>
                </div>
                <div class="level-bar">
                    <div class="level-bar-fill" id="level-fill" style="width:0%"></div>
                </div>
            </div>

            <div class="clicker-btn" id="clicker-btn" title="Кликни!">📚</div>
        </div>

        <div class="upgrades-panel" id="upgrades-panel">
            <div class="upgrades-title">Апгрейды</div>
            <div id="upgrade-list"></div>
        </div>

        <!-- События -->
        <div id="exam-overlay" class="event-overlay">
            <div class="event-panel">
                <div class="event-title">Сессия началась!</div>
                <div class="event-subtitle">Кликай по кнопке быстрее!</div>
                <button id="exam-btn" class="event-btn" title="Сдать билет">📄</button>
                <div class="event-timer" id="exam-timer">5.0</div>
                <div class="event-score" id="exam-score">0 кликов</div>
            </div>
        </div>

        <div id="lab-overlay" class="event-overlay">
            <div class="event-panel" style="position:relative;min-height:260px;">
                <div class="event-title">Лабораторная работа</div>
                <div class="event-subtitle">Попади по кнопке 8 раз!</div>
                <div class="event-timer" id="lab-timer">7.0</div>
                <div class="event-score" id="lab-score">0/8</div>
                <button id="lab-target" class="event-moving-btn">🔬</button>
            </div>
        </div>

        <div id="virus-overlay" class="event-overlay">
            <div class="virus-banner" id="virus-banner">
                <button id="virus-close" class="virus-close">×</button>
                <div class="virus-title">ВЫ ВЫИГРАЛИ<br>1 000 000 ЗНАНИЙ!</div>
            </div>
        </div>
    </div>

    <script src="api-client.js"></script>
    <script src="game-theme.js"></script>
    <script src="sounds.js"></script>
    <script src="cards.js"></script>
    <script src="game.js"></script>
    <script src="cards-ui.js"></script>
</body>
</html>
