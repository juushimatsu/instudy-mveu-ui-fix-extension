<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>InStudy Mono UI</title>
    <style>
        :root {
            --bg-0: #0a0a0c;
            --bg-1: #0e0e11;
            --bg-2: #15151a;
            --bg-3: #1c1c22;
            --bg-4: #26262d;
            --bg-5: #2f2f37;
            --border: #26262d;
            --border-2: #34343c;
            --text: #e8e8ec;
            --text-dim: #b0b0ba;
            --text-muted: #767680;
            --text-faint: #4f4f58;
            --accent: #f4f4f7;
            --accent-soft: #c8c8d0;
            --accent-dim: #80808a;
            --radius: 10px;
            --radius-sm: 6px;
            --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            --font-display: 'Unbounded', 'PT Sans', system-ui, sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg-1);
            color: var(--text);
            font-family: var(--font-display);
            font-size: 13px;
            width: 260px;
            padding: 16px;
        }
        h1 {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 14px 0;
            letter-spacing: .04em;
            text-transform: uppercase;
            color: var(--accent);
        }
        .section {
            margin-bottom: 14px;
        }
        .label {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .btn-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        button {
            background: var(--bg-3);
            color: var(--text-dim);
            border: 1px solid var(--border-2);
            border-radius: var(--radius-sm);
            padding: 6px 12px;
            font-family: var(--font-mono);
            font-size: 12px;
            cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease;
            flex: 1 1 auto;
            min-width: 0;
        }
        button:hover {
            background: var(--bg-2);
            border-color: var(--accent-dim);
            color: var(--text);
        }
        button.active {
            background: var(--accent);
            color: var(--bg-0);
            border-color: var(--accent);
        }
        .accent-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform .15s ease, border-color .15s ease;
        }
        .accent-dot:hover { transform: scale(1.15); }
        .accent-dot.active { border-color: var(--text); }
        .status {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            text-align: center;
        }
        .hint {
            margin-top: 10px;
            padding: 8px 10px;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.4;
        }
        .hint b {
            color: var(--accent-soft);
        }
    </style>
</head>
<body>
    <h1>InStudy Mono UI</h1>

    <div class="section">
        <div class="label">Тема</div>
        <div class="btn-row" id="theme-row">
            <button data-value="dark">Тёмная</button>
            <button data-value="light">Светлая</button>
        </div>
    </div>

    <div class="section">
        <div class="label">Акцент</div>
        <div class="btn-row" id="accent-row">
            <div class="accent-dot" data-value="mono"    style="background:#f4f4f7" title="Моно"></div>
            <div class="accent-dot" data-value="ocean"   style="background:#4a9eff" title="Океан"></div>
            <div class="accent-dot" data-value="crimson" style="background:#c25f5f" title="Кримсон"></div>
            <div class="accent-dot" data-value="amber"   style="background:#c8903a" title="Янтарь"></div>
            <div class="accent-dot" data-value="forest"  style="background:#5a9e6f" title="Лес"></div>
        </div>
    </div>

    <div class="section">
        <div class="label">Плотность</div>
        <div class="btn-row" id="density-row">
            <button data-value="compact">Компактно</button>
            <button data-value="normal">Нормально</button>
            <button data-value="wide">Широко</button>
        </div>
    </div>

    <div class="hint">
        <b>🎮 Кликер</b> доступен в боковом меню сайта — пункт «Кликер»
    </div>

    <div class="status" id="status">Загрузка…</div>

    <script src="popup.js"></script>
</body>
</html>
